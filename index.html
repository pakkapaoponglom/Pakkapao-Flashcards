<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pakkapaoponglom - Chinese Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'puffer-blue': '#38BDF8',
                        'puffer-blue-light': '#E0F2FE',
                        'puffer-pink': '#EC4899',
                        'puffer-pink-light': '#FCE7F3',
                        'puffer-dark': '#1E293B'
                    },
                    fontFamily: {
                        'chinese': ['"PingFang SC"', '"Microsoft YaHei"', '"SimSun"', '"Songti SC"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Mali', 'Prompt', sans-serif;
            background-color: #F0F9FF;
            background-image: radial-gradient(#BAE6FD 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .font-chinese {
            font-family: "PingFang SC", "Microsoft YaHei", "SimSun", "Songti SC", serif;
        }

        .card-perspective {
            perspective: 1000px;
        }

        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .cloud-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='40' viewBox='0 0 80 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 25 C 10 15, 20 10, 30 15 C 35 5, 50 5, 55 15 C 65 10, 75 18, 70 28 C 75 35, 60 38, 50 35 C 40 39, 20 38, 10 25 Z' fill='none' stroke='%23bae6fd' stroke-width='2' opacity='0.4'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="min-h-screen text-slate-700 flex flex-col justify-between cloud-pattern">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-sky-100 sticky top-0 z-40 px-4 py-3 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="setMode('random')">
                <div class="w-12 h-12 rounded-full bg-sky-100 border-2 border-sky-300 flex items-center justify-center text-2xl shadow-inner">
                    🐡
                </div>
                <div>
                    <h1 class="font-bold text-xl text-sky-800 leading-tight">pakkapaoponglom</h1>
                    <p class="text-xs text-pink-500 font-medium">Cute & Fun Chinese Flashcards</p>
                </div>
            </div>

            <button onclick="toggleStatsModal()" class="px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-600 rounded-xl text-xs font-semibold flex items-center gap-1.5 border border-sky-200">
                <i class="fa-solid fa-chart-line text-pink-400"></i>
                <span>สถิติ</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center my-2">

        <!-- Mascot Banner -->
        <div class="bg-white border-2 border-sky-200 rounded-2xl p-3 shadow-sm mb-4 flex items-center gap-3 relative">
            <div class="w-10 h-10 shrink-0 bg-sky-100 rounded-full flex items-center justify-center border border-sky-300 text-xl">
                🐡
            </div>
            <div class="text-xs text-sky-900 font-medium">
                <p id="mascot-dialog">"สวัสดีครับ! วันนี้มาฝึกทบทวนภาษาจีนกับน้องปักเป้ากันนะ!"</p>
            </div>
        </div>

        <!-- Mode Tabs -->
        <div class="bg-sky-100/80 p-1 rounded-2xl flex text-xs font-semibold text-sky-700 mb-4 shadow-inner">
            <button id="mode-random-btn" onclick="setMode('random')" class="flex-1 py-2 rounded-xl transition text-center shadow-sm bg-white text-puffer-pink font-bold">
                <i class="fa-solid fa-shuffle mr-1"></i> สุ่มคำ
            </button>
            <button id="mode-category-btn" onclick="setMode('category')" class="flex-1 py-2 rounded-xl transition text-center">
                <i class="fa-solid fa-list mr-1"></i> หมวดหมู่
            </button>
            <button id="mode-review-btn" onclick="setMode('smartReview')" class="flex-1 py-2 rounded-xl transition text-center">
                <i class="fa-solid fa-brain mr-1"></i> ปักเป้าช่วยจำ
            </button>
        </div>

        <!-- Category Panel -->
        <div id="category-panel" class="hidden bg-white p-4 rounded-2xl border border-sky-200 shadow-sm mb-4 space-y-3">
            <label class="text-xs font-bold text-sky-800 block">เลือกหมวดหมู่คำศัพท์:</label>
            <select id="category-select" onchange="changeCategory()" class="w-full text-xs p-2.5 bg-sky-50 border border-sky-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 text-sky-900">
                <option value="all">ทั้งหมด (All Words)</option>
                <option value="hsk1">HSK 1 - พื้นฐาน</option>
                <option value="food">หมวดอาหาร & เครื่องดื่ม</option>
                <option value="daily">ชีวิตประจำวัน</option>
            </select>
        </div>

        <!-- Flashcard Flip Area -->
        <div class="relative w-full h-80 card-perspective select-none">
            <div id="flashcard" onclick="flipCard()" class="card-inner w-full h-full relative cursor-pointer shadow-lg rounded-3xl border-4 border-white">
                
                <!-- Front Side -->
                <div class="card-front absolute inset-0 rounded-3xl bg-white p-6 flex flex-col justify-between items-center text-center border-2 border-sky-100">
                    <div class="w-full flex justify-between items-center text-xs text-sky-400">
                        <span id="card-category-badge" class="bg-sky-100 text-sky-600 px-2.5 py-1 rounded-full font-semibold">HSK 1</span>
                        <span id="card-counter" class="font-mono font-medium">1 / 9</span>
                    </div>

                    <div class="my-auto">
                        <h2 id="card-hanzi" class="text-6xl md:text-7xl font-chinese text-slate-900 tracking-normal mb-2 font-bold">你好</h2>
                        <p class="text-xs text-sky-400 flex items-center justify-center gap-1 opacity-80">
                            <i class="fa-solid fa-hand-pointer"></i> แตะเพื่อพลิกดูความหมาย
                        </p>
                    </div>

                    <div class="w-full flex justify-end">
                        <button onclick="event.stopPropagation(); speakWord();" class="w-10 h-10 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center border border-pink-200 shadow-sm">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                </div>

                <!-- Back Side -->
                <div class="card-back absolute inset-0 rounded-3xl bg-gradient-to-b from-pink-50/60 via-white to-sky-50 p-6 flex flex-col justify-between items-center text-center border-2 border-pink-200">
                    <div class="w-full flex justify-between items-center text-xs">
                        <span id="card-pos" class="bg-pink-100 text-pink-600 px-2.5 py-1 rounded-full font-bold uppercase">phrase</span>
                        <button onclick="event.stopPropagation(); speakWord();" class="text-pink-500 text-sm">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>

                    <div class="my-auto space-y-2">
                        <div id="card-pinyin" class="text-2xl font-bold text-pink-500 tracking-wide">nǐ hǎo</div>
                        <div id="card-meaning" class="text-xl font-bold text-slate-800">สวัสดี</div>
                        <div class="w-12 h-0.5 bg-pink-200 mx-auto my-2 rounded-full"></div>
                        <p id="card-example" class="text-xs text-slate-500 italic px-2">"你好！很高兴认识你。"</p>
                    </div>

                    <div class="text-[10px] text-sky-400">
                        แตะอีกครั้งเพื่อกลับหน้าหลัก
                    </div>
                </div>

            </div>
        </div>

        <!-- Smart Review Controls -->
        <div id="review-controls" class="hidden grid grid-cols-3 gap-2 mt-4">
            <button onclick="rateReview('hard')" class="py-2.5 px-2 bg-red-50 border border-red-200 text-red-600 rounded-xl font-medium text-xs flex flex-col items-center">
                <span class="font-bold">ยาก</span>
            </button>
            <button onclick="rateReview('good')" class="py-2.5 px-2 bg-amber-50 border border-amber-200 text-amber-700 rounded-xl font-medium text-xs flex flex-col items-center">
                <span class="font-bold">ปานกลาง</span>
            </button>
            <button onclick="rateReview('easy')" class="py-2.5 px-2 bg-emerald-50 border border-emerald-200 text-emerald-600 rounded-xl font-medium text-xs flex flex-col items-center">
                <span class="font-bold">ง่าย</span>
            </button>
        </div>

        <!-- Navigation Controls -->
        <div id="standard-controls" class="flex items-center justify-between gap-4 mt-4">
            <button onclick="prevCard()" class="flex-1 py-3 bg-white text-sky-600 font-semibold rounded-2xl border-2 border-sky-200 shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-chevron-left"></i> ก่อนหน้า
            </button>
            <button onclick="nextCard()" class="flex-1 py-3 bg-puffer-pink text-white font-semibold rounded-2xl shadow-md flex items-center justify-center gap-2">
                ถัดไป <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

    </main>

    <!-- Stats Modal -->
    <div id="stats-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border-2 border-sky-100 relative space-y-4">
            <button onclick="toggleStatsModal()" class="absolute top-4 right-4 text-slate-400">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="font-bold text-base text-sky-800">สถิติการจำ</h3>
            <div class="grid grid-cols-3 gap-2 text-center py-2">
                <div class="bg-red-50 p-3 rounded-2xl"><div id="stat-hard-count" class="text-xl font-bold text-red-600">0</div><div class="text-[10px]">ยาก</div></div>
                <div class="bg-amber-50 p-3 rounded-2xl"><div id="stat-good-count" class="text-xl font-bold text-amber-600">0</div><div class="text-[10px]">ปานกลาง</div></div>
                <div class="bg-emerald-50 p-3 rounded-2xl"><div id="stat-easy-count" class="text-xl font-bold text-emerald-600">0</div><div class="text-[10px]">ง่าย</div></div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const defaultWords = [
            { id: 1, hanzi: "你好", pinyin: "nǐ hǎo", meaning: "สวัสดี", pos: "phrase", example: "你好！很高兴认识你。", category: "hsk1" },
            { id: 2, hanzi: "谢谢", pinyin: "xiè xie", meaning: "ขอบคุณ", pos: "v.", example: "谢谢你的帮助。", category: "hsk1" },
            { id: 3, hanzi: "苹果", pinyin: "píng guǒ", meaning: "แอปเปิ้ล", pos: "n.", example: "我喜欢吃红苹果。", category: "food" },
            { id: 4, hanzi: "喝水", pinyin: "hē shuǐ", meaning: "ดื่มน้ำ", pos: "v.", example: "天气很热，多喝水。", category: "food" },
            { id: 5, hanzi: "学习", pinyin: "xué xí", meaning: "เรียน / ศึกษา", pos: "v.", example: "我在学习中文。", category: "daily" },
            { id: 6, hanzi: "漂亮", pinyin: "piào liang", meaning: "สวย", pos: "adj.", example: "她穿衣服很漂亮。", category: "daily" },
            { id: 7, hanzi: "非常", pinyin: "fēi cháng", meaning: "อย่างยิ่ง / มาก", pos: "adv.", example: "非常感谢你。", category: "daily" },
            { id: 8, hanzi: "朋友", pinyin: "péng you", meaning: "เพื่อน", pos: "n.", example: "他是我的好朋友。", category: "daily" },
            { id: 9, hanzi: "再见", pinyin: "zài jiàn", meaning: "ลาก่อน", pos: "phrase", example: "明天见，再见！", category: "hsk1" }
        ];

        let words = [...defaultWords];
        let currentWordList = [...words];
        let currentIndex = 0;
        let isFlipped = false;
        let reviewData = JSON.parse(localStorage.getItem('pakkapao_review_data')) || {};

        function initApp() {
            setMode('random');
        }

        function setMode(mode) {
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');

            document.getElementById('category-panel').classList.add('hidden');
            document.getElementById('review-controls').classList.add('hidden');
            document.getElementById('standard-controls').classList.remove('hidden');

            if (mode === 'random') {
                currentWordList = [...words].sort(() => Math.random() - 0.5);
            } else if (mode === 'category') {
                document.getElementById('category-panel').classList.remove('hidden');
                filterByCategory();
            } else if (mode === 'smartReview') {
                document.getElementById('review-controls').classList.remove('hidden');
                document.getElementById('standard-controls').classList.add('hidden');
            }

            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            if (currentWordList.length === 0) return;
            const item = currentWordList[currentIndex];
            document.getElementById('card-hanzi').innerText = item.hanzi;
            document.getElementById('card-pinyin').innerText = item.pinyin;
            document.getElementById('card-meaning').innerText = item.meaning;
            document.getElementById('card-pos').innerText = item.pos || 'vocab';
            document.getElementById('card-example').innerText = item.example ? `"${item.example}"` : "";
            document.getElementById('card-category-badge').innerText = item.category.toUpperCase();
            document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${currentWordList.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const fc = document.getElementById('flashcard');
            if (isFlipped) fc.classList.add('flipped');
            else fc.classList.remove('flipped');
        }

        function nextCard() {
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % currentWordList.length;
                renderCard();
            }, 150);
        }

        function prevCard() {
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                currentIndex = (currentIndex - 1 + currentWordList.length) % currentWordList.length;
                renderCard();
            }, 150);
        }

        function speakWord() {
            if (currentWordList.length === 0) return;
            const text = currentWordList[currentIndex].hanzi;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                window.speechSynthesis.speak(utterance);
            }
        }

        function changeCategory() {
            filterByCategory();
            currentIndex = 0;
            renderCard();
        }

        function filterByCategory() {
            const cat = document.getElementById('category-select').value;
            if (cat === 'all') currentWordList = [...words];
            else currentWordList = words.filter(w => w.category === cat);
        }

        function rateReview(rating) {
            const currentItem = currentWordList[currentIndex];
            reviewData[currentItem.id] = rating;
            localStorage.setItem('pakkapao_review_data', JSON.stringify(reviewData));
            nextCard();
        }

        function toggleStatsModal() {
            document.getElementById('stats-modal').classList.toggle('hidden');
            let hard = 0, good = 0, easy = 0;
            Object.values(reviewData).forEach(v => {
                if (v === 'hard') hard++;
                if (v === 'good') good++;
                if (v === 'easy') easy++;
            });
            document.getElementById('stat-hard-count').innerText = hard;
            document.getElementById('stat-good-count').innerText = good;
            document.getElementById('stat-easy-count').innerText = easy;
        }

        window.onload = initApp;
    </script>
</body>
    </html>
